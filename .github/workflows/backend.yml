# ─────────────────────────────────────────────────────────────
#  Backend CI/CD — Tests + Deploy a Azure App Service
#  Se ejecuta en cada push a develop
#
#  NOTA: El paso de deploy está comentado hasta que despliegues
#  el App Service con Terraform. Solo descoméntalo entonces.
# ─────────────────────────────────────────────────────────────
name: Backend — Tests & Deploy

on:
  push:
    branches: [desarrollo]
    paths:
      - "backend/**"        # Solo si cambia algo en backend
      - ".github/workflows/backend.yml"

  workflow_dispatch:        # Permite ejecutarlo manualmente

jobs:

  # ──────────────── TESTS ────────────────
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx pytest-cov

      - name: Flake8 — estilo
        working-directory: backend
        run: flake8 . --max-line-length=120 --exclude=__pycache__,.venv,logs

      - name: Tests con cobertura
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-only-for-ci-32chars!!"
          ENVIRONMENT: "testing"
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            || echo "⚠️ No hay tests todavía — crea tests/test_health.py"

  # ──────────────── DEPLOY ────────────────
  # DESCOMENTA ESTE JOB cuando tengas el App Service desplegado con Terraform
  # y hayas descargado el Publish Profile desde Azure Portal y lo hayas
  # añadido como secret AZURE_WEBAPP_PUBLISH_PROFILE en GitHub.

  deploy:
    
    name: Deploy a Azure App Service
    runs-on: ubuntu-latest
    needs: test           # Solo despliega si los tests pasan
    environment: desarrollo  # Protección de entorno en GitHub

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 🔍 Diagnóstico — Listar archivos para deploy
        working-directory: backend
        run: |
          echo "Contenido de la carpeta backend/ que se va a desplegar:"
          ls -R

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy a Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "soundlog-backend"    # Nombre de tu App Service en Azure
          package: backend/

      - name: ✅ Deploy completado
        run: echo "Backend desplegado en App Service"
