# ─────────────────────────────────────────────────────────────
#  Backend CI/CD — Tests + Deploy a Azure App Service
#  Se ejecuta en cada push a desarrollo
#
#  NOTA: El paso de deploy descomentado hasta desplegar
#  el App Service con Terraform.
# ─────────────────────────────────────────────────────────────
name: Backend — Tests & Deploy

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"        # Solo si cambia algo en backend
      - ".github/workflows/backend.yml"

  workflow_dispatch:        # Permite ejecutarlo manualmente

jobs:

  # ──────────────── TESTS ────────────────
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx pytest-cov

      - name: Flake8 — estilo
        working-directory: backend
        run: flake8 . --max-line-length=120 --exclude=__pycache__,.venv,logs

      - name: Tests con cobertura
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-only-for-ci-32chars!!"
          ENVIRONMENT: "testing"
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            || echo "⚠️ No hay tests todavía — crea tests/test_health.py"

  # ──────────────── DEPLOY ────────────────
  # DESCOMENTAR ESTE JOB cuando tengas el App Service desplegado con Terraform
  # Y se haya descargado el Publish Profile desde Azure Portal y lo hayas
  # añadido como secret AZURE_WEBAPP_PUBLISH_PROFILE en GitHub.
