# ─────────────────────────────────────────────────────────────
#  Frontend CI/CD — Build + Deploy a Azure Blob Storage
#  Usa OIDC (Managed Identity) — sin contraseñas
# ─────────────────────────────────────────────────────────────
name: Frontend — Build & Deploy

on:
  push:
    branches: [desarrollo]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Vite → Azure Blob Storage
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # OIDC
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: TypeScript — comprobar tipos
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      # Login con OIDC — sin ARM_CLIENT_SECRET
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy a Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --auth-mode login \
            --destination '$web' \
            --source frontend/dist \
            --overwrite true

      - name: ✅ Deploy completado
        run: echo "https://soundlogdevfrontend.z28.web.core.windows.net/"
