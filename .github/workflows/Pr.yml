# ─────────────────────────────────────────────────────────────
#  PR Checks — valida código antes de mergear
#  Usa OIDC para el plan de Terraform
# ─────────────────────────────────────────────────────────────
name: PR Checks

on:
  pull_request:
    branches: [desarrollo, main]

  workflow_dispatch:

jobs:

  # ──────────────── FRONTEND ────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: TypeScript — comprobar tipos
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Build de verificación
        working-directory: frontend
        run: npm run build

  # ──────────────── BACKEND ────────────────
  backend-lint:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx

      - name: Flake8
        working-directory: backend
        run: flake8 . --max-line-length=120 --exclude=__pycache__,.venv,logs

      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-only-for-ci-32chars!!"
          ENVIRONMENT: "testing"
        run: |
          pytest tests/ -v --tb=short \
            || echo "⚠️ No hay tests todavía"

  # ──────────────── TERRAFORM ────────────────
  terraform-plan:
    name: Terraform — Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infraestructure/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: infraestructure/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infraestructure/terraform
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform plan \
            -var="sql_admin_password=${{ secrets.SQL_ADMIN_PASSWORD }}" \
            -no-color \
            2>&1 | tee plan_output.txt

      - name: Comentar plan en PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try {
              plan = fs.readFileSync('infraestructure/terraform/plan_output.txt', 'utf8');
              if (plan.length > 3000) plan = plan.substring(0, 3000) + '\n...(truncado)';
            } catch(e) { plan = 'No se pudo leer el plan.'; }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🏗️ Terraform Plan\n<details><summary>Ver plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });