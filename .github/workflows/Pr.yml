# ─────────────────────────────────────────────────────────────
#  PR Checks — se ejecuta en cada Pull Request
#  Valida que el código esté limpio antes de mergear
# ─────────────────────────────────────────────────────────────
name: PR Checks

on:
  pull_request:
    branches: [desarrollo, main]

jobs:

  # ──────────────── FRONTEND ────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: TypeScript — comprobar tipos
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Comprobar que el build funciona
        working-directory: frontend
        run: npm run build

  # ──────────────── BACKEND ────────────────
  backend-lint:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx

      - name: Flake8 — estilo de código
        working-directory: backend
        run: flake8 . --max-line-length=120 --exclude=__pycache__,.venv

      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-only-for-ci-32chars!!"
          ENVIRONMENT: "testing"
        run: pytest tests/ -v --tb=short || echo "⚠️ No hay tests aún — crea tests/test_health.py"

  # ──────────────── TERRAFORM ────────────────
  terraform-plan:
    name: Terraform — Plan (preview de cambios)
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: infraestructure/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: infraestructure/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infraestructure/terraform
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Publicar plan como comentario en el PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `### 📋 Terraform Plan
            \`\`\`
            Ver los logs del job terraform-plan para los detalles del plan.
            \`\`\`
            *Workflow: \`${{ github.workflow }}\` | Rama: \`${{ github.ref }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })