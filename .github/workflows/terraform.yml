# ─────────────────────────────────────────────────────────────
#  Terraform CI/CD con OIDC (Managed Identity)
#  Sin contraseñas — Azure confía en GitHub directamente
# ─────────────────────────────────────────────────────────────
name: Terraform

on:
  push:
    branches: [desarrollo, main]
    paths:
      - "infraestructure/terraform/**"
      - ".github/workflows/terraform.yml"

  pull_request:
    branches: [desarrollo, main]
    paths:
      - "infraestructure/terraform/**"

  workflow_dispatch:

env:
  TF_WORKING_DIR: infraestructure/terraform

jobs:

  # ──────────────── PLAN (siempre) ────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # Permisos necesarios para OIDC
    permissions:
      id-token: write   # Pedir token OIDC a GitHub
      contents: read    # Leer el repo
      pull-requests: write  # Comentar en PRs

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Login en Azure usando OIDC — sin contraseñas
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform plan \
            -var="sql_admin_password=${{ secrets.SQL_ADMIN_PASSWORD }}" \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan_output.txt

      - name: Publicar plan en PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
              if (planOutput.length > 3000) {
                planOutput = planOutput.substring(0, 3000) + '\n... (truncado, ver logs completos)';
              }
            } catch(e) {
              planOutput = 'No se pudo leer el plan.';
            }
            const body = `### 🏗️ Terraform Plan

            <details><summary>Ver plan completo</summary>

            \`\`\`
            ${planOutput}
            \`\`\`
            </details>

            *Workflow: \`${{ github.workflow }}\` | Commit: \`${{ github.sha }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ──────────────── APPLY (solo en push a develop) ────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/desarrollo'
    environment: desarrollo  # Aprobación manual en GitHub Settings

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform apply \
            -var="sql_admin_password=${{ secrets.SQL_ADMIN_PASSWORD }}" \
            -auto-approve \
            -no-color