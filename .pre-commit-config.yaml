# Ejecutar antes de cada commit: pre-commit install
# Manual: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^backend/
        args: [--config=backend/.flake8]

  - repo: local
    hooks:
      - id: backend-ci-checks
        name: backend flake8 + pytest
        entry: python backend/scripts/run_ci_checks.py
        language: system
        files: ^backend/
        pass_filenames: false
